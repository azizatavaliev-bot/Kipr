<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f5f5f7">
<title>Кипр — гид</title>
<style>
  :root {
    --bg: #f5f5f7;
    --bg-elevated: rgba(255,255,255,0.72);
    --card: rgba(255,255,255,0.7);
    --card-solid: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --separator: rgba(60,60,67,0.12);
    --accent: #0071e3;
    --accent-soft: rgba(0,113,227,0.1);
    --gold: #b8873b;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    --blur: saturate(180%) blur(20px);
    --ease-out: cubic-bezier(.16,1,.3,1);
    --ease-spring: cubic-bezier(.34,1.4,.44,1);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --bg-elevated: rgba(28,28,30,0.72);
      --card: rgba(28,28,30,0.72);
      --card-solid: #1c1c1e;
      --text: #f5f5f7;
      --muted: #98989d;
      --separator: rgba(84,84,88,0.4);
      --accent: #0a84ff;
      --accent-soft: rgba(10,132,255,0.16);
      --gold: #e0a458;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.47;
    letter-spacing: -0.01em;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overscroll-behavior-y: none;
  }
  /* мягкое световое пятно на фоне — как в системных обоях */
  body::before {
    content: '';
    position: fixed; inset: -20% -20% auto -20%; height: 60vh;
    background: radial-gradient(60% 60% at 30% 20%, rgba(0,113,227,.16), transparent 70%),
                radial-gradient(50% 50% at 80% 0%, rgba(184,135,59,.14), transparent 70%);
    pointer-events: none; z-index: 0;
    animation: floatGlow 18s var(--ease-out) infinite alternate;
  }
  @keyframes floatGlow { to { transform: translate3d(0, 4%, 0) scale(1.08); } }

  #app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; min-height: 100%; }

  /* ---------- Навигация сверху ---------- */
  header.nav {
    position: sticky; top: 0; z-index: 20;
    padding: calc(env(safe-area-inset-top) + 10px) 20px 10px;
    background: var(--bg-elevated);
    -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    border-bottom: 1px solid transparent;
    transition: border-color .3s var(--ease-out);
  }
  header.nav.scrolled { border-bottom-color: var(--separator); }
  .nav-row { display: flex; align-items: center; gap: 6px; min-height: 32px; }
  .nav-title { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
  .large-title {
    font-size: 40px; line-height: 1.06; font-weight: 700; letter-spacing: -0.03em;
    margin: 8px 0 2px;
  }
  .subtitle { color: var(--muted); font-size: 15px; margin: 0 0 4px; }

  .back-btn {
    background: none; border: none; padding: 4px 6px 4px 0; margin-left: -6px;
    font: inherit; font-size: 17px; color: var(--accent); cursor: pointer;
    display: inline-flex; align-items: center; gap: 2px;
    transition: opacity .2s var(--ease-out), transform .2s var(--ease-spring);
  }
  .back-btn:active { opacity: .5; transform: translateX(-2px); }
  .back-btn svg { width: 11px; height: 18px; }

  main { padding: 12px 20px calc(110px + env(safe-area-inset-bottom)); }

  .section-title {
    font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    color: var(--muted); margin: 26px 0 10px;
  }
  .section-title:first-child { margin-top: 6px; }

  /* ---------- Карточки ---------- */
  .card {
    position: relative;
    background: var(--card);
    -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    border: 1px solid var(--separator);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    transition: transform .45s var(--ease-spring), box-shadow .45s var(--ease-out);
  }
  .card.tappable { cursor: pointer; }
  .card.tappable:active { transform: scale(.975); box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .card h3 { margin: 0 0 3px; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
  .card p { margin: 0; font-size: 15px; color: var(--muted); line-height: 1.45; }
  .tag {
    display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .02em;
    color: var(--gold); margin-bottom: 5px;
  }
  .chev { position: absolute; right: 16px; top: 50%; margin-top: -8px; color: var(--separator); }

  /* ---------- Фильтры ---------- */
  .chip-row { display: flex; gap: 8px; margin: 4px 0 6px; flex-wrap: wrap; }
  .chip {
    padding: 7px 15px; border-radius: 999px; border: 1px solid var(--separator);
    font-size: 14px; font-weight: 500; cursor: pointer;
    background: var(--card); color: var(--text);
    -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    transition: background .35s var(--ease-out), color .35s var(--ease-out),
                border-color .35s var(--ease-out), transform .35s var(--ease-spring);
  }
  .chip:active { transform: scale(.94); }
  .chip.active { background: var(--text); border-color: var(--text); color: var(--bg); }

  /* ---------- Таб-бар ---------- */
  nav.tabbar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px; z-index: 30;
    background: var(--bg-elevated);
    -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    border-top: 1px solid var(--separator);
    display: flex; justify-content: space-around;
    padding: 8px 0 calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabbar button {
    background: none; border: none; font-family: inherit;
    font-size: 10px; font-weight: 500; letter-spacing: 0; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: pointer; padding: 4px 10px;
    transition: color .3s var(--ease-out), transform .35s var(--ease-spring);
  }
  nav.tabbar button:active { transform: scale(.9); }
  nav.tabbar button svg { width: 25px; height: 25px; }
  nav.tabbar button.active { color: var(--accent); }
  nav.tabbar button.active svg { animation: tabPop .45s var(--ease-spring); }
  @keyframes tabPop { 0% { transform: scale(.8); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }

  /* ---------- Избранное ---------- */
  .attraction-card { display: flex; align-items: flex-start; gap: 12px; }
  .attraction-card .body { flex: 1; min-width: 0; }
  .fav-star {
    flex: none; width: 34px; height: 34px; display: grid; place-items: center;
    color: var(--gold); cursor: pointer; user-select: none;
    transition: transform .4s var(--ease-spring);
  }
  .fav-star:active { transform: scale(.85); }
  .fav-star.on svg { animation: starPop .5s var(--ease-spring); }
  @keyframes starPop { 0% { transform: scale(.6) rotate(-25deg); } 60% { transform: scale(1.25) rotate(6deg); } 100% { transform: scale(1); } }

  .info-label { font-size: 15px; font-weight: 600; margin-bottom: 3px; letter-spacing: -0.01em; }
  .empty-state { text-align: center; color: var(--muted); font-size: 15px; padding: 80px 24px; }
  .empty-state .big { font-size: 44px; display: block; margin-bottom: 12px; opacity: .5; }

  /* ---------- Плавное появление текста ---------- */
  @keyframes riseIn {
    from { opacity: 0; transform: translate3d(0, 14px, 0); filter: blur(6px); }
    to   { opacity: 1; transform: none; filter: blur(0); }
  }
  @keyframes riseInSoft {
    from { opacity: 0; transform: translate3d(0, 8px, 0); }
    to   { opacity: 1; transform: none; }
  }
  .reveal {
    opacity: 0;
    animation: riseIn .75s var(--ease-out) forwards;
    animation-delay: var(--d, 0ms);
    will-change: opacity, transform, filter;
  }
  .reveal-soft { opacity: 0; animation: riseInSoft .55s var(--ease-out) forwards; animation-delay: var(--d, 0ms); }

  /* пословное появление заголовка */
  .word { display: inline-block; opacity: 0; animation: riseIn .8s var(--ease-out) forwards; animation-delay: var(--d, 0ms); }

  /* смена экрана */
  .screen { animation: screenIn .5s var(--ease-out) both; }
  @keyframes screenIn { from { opacity: 0; transform: translate3d(0, 10px, 0) scale(.995); } to { opacity: 1; transform: none; } }
  .screen.push { animation: pushIn .45s var(--ease-out) both; }
  @keyframes pushIn { from { opacity: 0; transform: translate3d(24px, 0, 0); } to { opacity: 1; transform: none; } }
  .screen.pop { animation: popIn .45s var(--ease-out) both; }
  @keyframes popIn { from { opacity: 0; transform: translate3d(-18px, 0, 0); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .reveal, .reveal-soft, .word { opacity: 1; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const cities = [
  { id: 'nicosia', name: 'Никосия (Lefkosia)', region: 'south', tagline: 'Последняя разделённая столица Европы',
    description: 'Столица Кипра, разделена «зелёной линией» ООН на греческую и турецкую части. Старый город в венецианских стенах, музеи, торговые улицы Ledra и Onasagorou.',
    attractions: [
      { id: 'n1', name: 'Ledra Street', description: 'Главная пешеходная улица, переход через КПП Ледра на север города.' },
      { id: 'n2', name: 'Кипрский музей', description: 'Крупнейшее собрание археологии острова: от неолита до римской эпохи.' },
      { id: 'n3', name: 'Венецианские стены', description: 'Фортификации XVI века, окружающие старый город, 11 бастионов.' },
    ]},
  { id: 'limassol', name: 'Лимассол', region: 'south', tagline: 'Деловая столица и порт',
    description: 'Крупнейший порт острова, центр деловой и ночной жизни, много выходцев из СНГ. Замок, набережная Molos, старый город.',
    attractions: [
      { id: 'l1', name: 'Замок Лимассола', description: 'Средневековая крепость, где по преданию венчался Ричард Львиное Сердце.' },
      { id: 'l2', name: 'Набережная Molos', description: 'Парк вдоль моря 2 км, скульптуры, велодорожка.' },
      { id: 'l3', name: 'Древний Курион (Kourion)', description: 'Греко-римский амфитеатр с видом на море, действующая сцена.' },
    ]},
  { id: 'larnaca', name: 'Ларнака', region: 'south', tagline: 'Ворота острова с главным аэропортом',
    description: 'Город с международным аэропортом, набережной Finikoudes, солёным озером с фламинго зимой.',
    attractions: [
      { id: 'la1', name: 'Церковь Св. Лазаря', description: 'Храм IX века над гробницей воскрешённого Лазаря.' },
      { id: 'la2', name: 'Соляное озеро', description: 'Зимовье фламинго, рядом мечеть Хала Султан Текке.' },
      { id: 'la3', name: 'Набережная Finikoudes', description: 'Пальмовая набережная и городской пляж в центре.' },
    ]},
  { id: 'paphos', name: 'Пафос', region: 'south', tagline: 'Мифология и объект ЮНЕСКО',
    description: 'По легенде — место рождения Афродиты. Археологический парк Пафоса в списке ЮНЕСКО, мозаики римских вилл.',
    attractions: [
      { id: 'p1', name: 'Скала Афродиты (Petra tou Romiou)', description: 'Прибрежная скала — по мифу, место рождения богини любви.' },
      { id: 'p2', name: 'Археологический парк Пафоса', description: 'Римские мозаики виллы Диониса, объект наследия ЮНЕСКО.' },
      { id: 'p3', name: 'Гробницы царей', description: 'Подземные усыпальницы элиты III века до н.э., высечены в скале.' },
    ]},
  { id: 'ayianapa', name: 'Айя-Напа', region: 'south', tagline: 'Пляжи и ночная жизнь',
    description: 'Курорт на юго-востоке с одними из лучших пляжей Средиземноморья и главным клубным районом острова.',
    attractions: [
      { id: 'an1', name: 'Пляж Нисси Бич', description: 'Белый песок, бирюзовая вода, песчаная коса до островка.' },
      { id: 'an2', name: 'Тропа Кейп-Греко', description: 'Нацпарк с морскими пещерами, скалами и смотровыми точками.' },
      { id: 'an3', name: 'Монастырь Айя-Напы', description: 'Венецианский монастырь XVI века в центре курорта.' },
    ]},
  { id: 'kyrenia', name: 'Кирения (Girne)', region: 'north', tagline: 'Северная часть острова',
    description: 'Портовый город на непризнанной Турецкой Республике Северного Кипра. Требуется пересечение погранперехода из южной части.',
    attractions: [
      { id: 'k1', name: 'Гавань Кирении', description: 'Венецианская гавань с крепостью в устье порта.' },
      { id: 'k2', name: 'Замок Св. Иллариона', description: 'Крепость крестоносцев в горах Пентадактилос.' },
    ]},
];

const beaches = [
  { id: 'b1', name: 'Нисси Бич', location: 'Айя-Напа', note: 'Флаг ЕС «Голубой флаг», семейный, шумный днём летом.' },
  { id: 'b2', name: 'Фигового дерева (Fig Tree Bay)', location: 'Протарас', note: 'Спокойная вода, подходит для детей и снорклинга.' },
  { id: 'b3', name: 'Coral Bay', location: 'Пафос', note: 'Песчаный, развитая инфраструктура, закаты.' },
  { id: 'b4', name: 'Ленивый пляж (Lady’s Mile)', location: 'Лимассол', note: 'Длинная песчаная коса у солёного озера, кайтсёрфинг.' },
];

const practicalInfo = [
  { label: 'Виза', value: 'Гражданам Кыргызстана для въезда на юг Кипра нужна виза — шенгенская или национальная категории C. Правила меняются, уточняй в консульстве перед поездкой.' },
  { label: 'Валюта', value: 'Евро (€) на юге острова. На севере (ТРСК) в ходу турецкая лира, но евро принимают почти везде.' },
  { label: 'Язык', value: 'Официальные языки — греческий (юг) и турецкий (север). В туристических зонах повсеместно английский.' },
  { label: 'Транспорт', value: 'Общественный транспорт слабый — автобусы между городами ходят редко. Оптимально аренда авто, руль справа, движение левостороннее.' },
  { label: 'Климат', value: 'Средиземноморский: сухое жаркое лето (до +35...40°C с июня по сентябрь), мягкая влажная зима (+15...18°C).' },
  { label: 'Часовой пояс', value: 'UTC+2 (летом UTC+3), разница с Бишкеком минус 4 часа зимой / минус 3 летом.' },
  { label: 'Переход юг/север', value: 'Возможен на нескольких КПП по паспорту, обычно без визы на короткий срок.' },
  { label: 'Экстренные службы', value: 'Единый номер — 112 (полиция, скорая, пожарная).' },
];

const cuisine = [
  { name: 'Халуми', description: 'Полутвёрдый сыр из овечьего/козьего молока, жарят на гриле.' },
  { name: 'Мезе', description: 'Набор из 15-20 маленьких блюд — закуски, мясо, морепродукты, овощи.' },
  { name: 'Сувла/сувлаки', description: 'Крупные куски мяса на вертеле или шпажках, готовят на углях.' },
  { name: 'Клефтико', description: 'Баранина или козлятина, томлённая много часов в закрытой печи.' },
];

const icons = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>',
  beaches: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="3.2"/><path d="M3 16.5c1.6-1.4 3.2-1.4 4.8 0s3.2 1.4 4.8 0 3.2-1.4 4.8 0 2.2 1.2 3.6.4"/><path d="M3 20.2c1.6-1.4 3.2-1.4 4.8 0s3.2 1.4 4.8 0 3.2-1.4 4.8 0 2.2 1.2 3.6.4"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r="1" fill="currentColor" stroke="none"/></svg>',
  favorites: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3.8 2.6 5.4 5.9.8-4.3 4.1 1.1 5.9-5.3-2.9-5.3 2.9 1.1-5.9L3.5 10l5.9-.8z"/></svg>',
  chevron: '<svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1 1 6 6-6 6"/></svg>',
  back: '<svg viewBox="0 0 11 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 1.5 2 9l7.5 7.5"/></svg>',
  starOn: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="m12 3.5 2.7 5.6 6.1.8-4.5 4.2 1.2 6.1L12 17.2 6.5 20.2l1.2-6.1L3.2 9.9l6.1-.8z"/></svg>',
  starOff: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="m12 3.9 2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 17.2l-5.3 2.9 1.1-5.9L3.5 10l5.9-.8z"/></svg>',
};

let state = { tab: 'home', cityId: null, cityFilter: 'all', favorites: new Set(), transition: '' };

/* ---- помощники анимации: каждый блок текста появляется со сдвигом по времени ---- */
let tick = 0;
const STEP = 55;      // шаг между элементами, мс
const BASE = 40;      // задержка старта
function d(extra = 0) { return `style="--d:${BASE + (tick++) * STEP + extra}ms"`; }
function resetTick() { tick = 0; }

/* заголовок появляется по словам */
function words(text, start = 0, step = 70) {
  return text.split(' ').map((w, i) =>
    `<span class="word" style="--d:${start + i * step}ms">${w}</span>`).join(' ');
}

function render() {
  resetTick();
  const app = document.getElementById('app');
  const cls = 'screen' + (state.transition ? ' ' + state.transition : '');
  app.innerHTML = renderHeader() + `<main class="${cls}">` + renderMain() + '</main>' + renderTabbar();
  state.transition = '';
  window.scrollTo(0, 0);
  bindScroll();
}

function bindScroll() {
  const nav = document.querySelector('header.nav');
  if (!nav) return;
  const onScroll = () => nav.classList.toggle('scrolled', window.scrollY > 4);
  onScroll();
  window.onscroll = onScroll;
}

function renderHeader() {
  if (state.cityId) {
    const c = cities.find(x => x.id === state.cityId);
    return `<header class="nav"><div class="nav-row">
      <button class="back-btn" onclick="closeCity()">${icons.back}<span>Города</span></button>
      <span class="nav-title reveal-soft" style="--d:220ms;margin-left:2px;opacity:0">${c.name.split(' (')[0]}</span>
    </div></header>`;
  }
  const titles = { home: 'Кипр', beaches: 'Пляжи', info: 'Информация', favorites: 'Избранное' };
  const subs = {
    home: 'Остров Афродиты — история, пляжи и практика',
    beaches: 'Куда ехать за морем',
    info: 'Всё, что нужно знать до поездки',
    favorites: 'Сохранённые места',
  };
  return `<header class="nav">
    <h1 class="large-title">${words(titles[state.tab], 0, 80)}</h1>
    <p class="subtitle reveal-soft" style="--d:200ms">${subs[state.tab]}</p>
  </header>`;
}

function renderMain() {
  if (state.cityId) return renderCityDetail();
  if (state.tab === 'beaches') return renderBeaches();
  if (state.tab === 'info') return renderInfo();
  if (state.tab === 'favorites') return renderFavorites();
  return renderCities();
}

function renderCities() {
  const filters = [['all','Все'],['south','Республика Кипр'],['north','Северный Кипр']];
  const chips = filters.map(([k,l]) =>
    `<div class="chip ${state.cityFilter===k?'active':''} reveal-soft" ${d()} onclick="setFilter('${k}')">${l}</div>`).join('');
  const list = cities.filter(c => state.cityFilter==='all' || c.region===state.cityFilter);
  const cards = list.map(c => `
    <div class="card tappable reveal" ${d()} onclick="openCity('${c.id}')">
      <span class="tag">${c.tagline}</span>
      <h3>${c.name}</h3>
      <p>${c.description}</p>
      <span class="chev">${icons.chevron}</span>
    </div>`).join('');
  return `<div class="chip-row">${chips}</div>
    <div class="section-title reveal-soft" ${d()}>Города и курорты</div>${cards}`;
}

function renderCityDetail() {
  const c = cities.find(x => x.id === state.cityId);
  const attractions = c.attractions.map(a => {
    const fav = state.favorites.has(a.id);
    return `<div class="card attraction-card reveal" ${d()}>
      <div class="body"><h3>${a.name}</h3><p>${a.description}</p></div>
      <div class="fav-star ${fav ? 'on' : ''}" onclick="toggleFav(event,'${a.id}')">${fav ? icons.starOn : icons.starOff}</div>
    </div>`;
  }).join('');
  return `
    <h2 class="large-title" style="margin-top:0">${words(c.name, 60, 80)}</h2>
    <p class="reveal-soft" ${d(120)} style="color:var(--gold);font-size:14px;font-weight:600;margin:2px 0 12px;">${c.tagline}</p>
    <p class="reveal" ${d()} style="font-size:16px;line-height:1.5;margin:0;">${c.description}</p>
    <div class="section-title reveal-soft" ${d()}>Что посмотреть</div>
    ${attractions}`;
}

function renderBeaches() {
  return beaches.map(b => `
    <div class="card reveal" ${d()}>
      <span class="tag">${b.location}</span>
      <h3>${b.name}</h3>
      <p>${b.note}</p>
    </div>`).join('');
}

function renderInfo() {
  const info = practicalInfo.map(r => `
    <div class="card reveal" ${d()}><div class="info-label">${r.label}</div><p>${r.value}</p></div>`).join('');
  const foodTitle = `<div class="section-title reveal-soft" ${d()}>Кухня</div>`;
  const food = cuisine.map(c => `
    <div class="card reveal" ${d()}><div class="info-label">${c.name}</div><p>${c.description}</p></div>`).join('');
  return `<div class="section-title reveal-soft" style="--d:60ms">Практическая информация</div>${info}${foodTitle}${food}`;
}

function renderFavorites() {
  const all = cities.flatMap(c => c.attractions.map(a => ({...a, cityName: c.name})));
  const favs = all.filter(a => state.favorites.has(a.id));
  if (!favs.length) {
    return `<div class="empty-state reveal" style="--d:80ms">
      <span class="big">☆</span>Пока пусто.<br>Отметьте места звёздочкой на странице города.</div>`;
  }
  return favs.map(a => `
    <div class="card reveal" ${d()}>
      <span class="tag">${a.cityName}</span>
      <h3>${a.name}</h3>
      <p>${a.description}</p>
    </div>`).join('');
}

function renderTabbar() {
  const tabs = [['home','Главная'],['beaches','Пляжи'],['info','Инфо'],['favorites','Избранное']];
  const buttons = tabs.map(([key,label]) =>
    `<button class="${state.tab===key && !state.cityId ?'active':''}" onclick="setTab('${key}')">
      ${icons[key]}<span>${label}</span>
    </button>`).join('');
  return `<nav class="tabbar">${buttons}</nav>`;
}

function setTab(tab) {
  if (tab === state.tab && !state.cityId) return;
  state.tab = tab; state.cityId = null; render();
}
function setFilter(f) { if (f === state.cityFilter) return; state.cityFilter = f; render(); }
function openCity(id) { state.cityId = id; state.transition = 'push'; render(); }
function closeCity() { state.cityId = null; state.transition = 'pop'; render(); }
function toggleFav(e, id) {
  e.stopPropagation();
  state.favorites.has(id) ? state.favorites.delete(id) : state.favorites.add(id);
  // перерисовываем только звезду, чтобы не «моргала» вся страница
  const el = e.currentTarget;
  const on = state.favorites.has(id);
  el.classList.toggle('on', on);
  el.innerHTML = on ? icons.starOn : icons.starOff;
}

render();
</script>
</body>
</html>
