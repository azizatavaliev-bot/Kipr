<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Кипр — гид</title>
<style>
  :root {
    /* Telegram-подобная светлая тема, акцент — оранжевый */
    --bg: #ffffff;
    --bg-grouped: #efeff4;
    --row: #ffffff;
    --row-active: #f2f2f6;
    --text: #000000;
    --muted: #8e8e93;
    --separator: #e6e6ea;
    --accent: #f7801e;
    --accent-dark: #dd6a0c;
    --accent-soft: #fff2e5;
    --nav-bg: rgba(255,255,255,.86);
    --ease-out: cubic-bezier(.16,1,.3,1);
    --ease-spring: cubic-bezier(.34,1.4,.44,1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px; line-height: 1.4; letter-spacing: -0.01em;
    background: var(--bg-grouped);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100%; background: var(--bg-grouped); }

  /* ---------- Верхняя панель (как в Telegram) ---------- */
  header.nav {
    position: sticky; top: 0; z-index: 20;
    background: var(--nav-bg);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-bottom: .5px solid var(--separator);
    padding: calc(env(safe-area-inset-top) + 8px) 12px 8px;
  }
  .nav-row { position: relative; display: flex; align-items: center; min-height: 34px; }
  .nav-title {
    position: absolute; left: 0; right: 0; text-align: center;
    font-size: 17px; font-weight: 600; letter-spacing: -0.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding: 0 64px; pointer-events: none;
  }
  .nav-sub { text-align: center; font-size: 13px; color: var(--muted); margin-top: 1px; }
  .back-btn {
    position: relative; z-index: 1;
    background: none; border: none; padding: 4px 8px 4px 0; margin-left: -4px;
    font: inherit; font-size: 17px; color: var(--accent); cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
    transition: opacity .2s var(--ease-out), transform .25s var(--ease-spring);
  }
  .back-btn:active { opacity: .5; transform: translateX(-2px); }
  .back-btn svg { width: 11px; height: 18px; }

  main { padding: 0 0 calc(104px + env(safe-area-inset-bottom)); }

  /* ---------- Сгруппированные списки ---------- */
  .group {
    background: var(--row); margin: 0 0 22px;
    border-top: .5px solid var(--separator); border-bottom: .5px solid var(--separator);
    overflow: hidden;
  }
  @media (min-width: 460px) { .group { margin: 0 12px 22px; border-radius: 12px; border: .5px solid var(--separator); } }
  .group-title {
    font-size: 13px; font-weight: 400; color: var(--muted);
    text-transform: uppercase; letter-spacing: .03em;
    padding: 22px 16px 7px;
  }
  .group-footer { font-size: 13px; color: var(--muted); padding: 7px 16px 0; margin-top: -18px; margin-bottom: 22px; }

  /* ---------- Строка списка ---------- */
  .row {
    position: relative; display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; background: var(--row); cursor: pointer;
    transition: background .18s var(--ease-out);
  }
  .row:active { background: var(--row-active); }
  .row + .row::before {
    content: ''; position: absolute; top: 0; left: 80px; right: 0; height: .5px; background: var(--separator);
  }
  .row.plain + .row.plain::before { left: 16px; }
  .row .body { flex: 1; min-width: 0; }
  .row .title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 2px; }
  .row .sub {
    font-size: 14px; color: var(--muted); line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .row .chev { flex: none; color: #c4c4c7; display: flex; }

  /* ---------- Аватар-фото ---------- */
  .avatar {
    flex: none; width: 54px; height: 54px; border-radius: 50%; overflow: hidden;
    background: var(--ph, linear-gradient(135deg, #f7801e, #ffb36b));
    position: relative;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block;
    opacity: 0; transition: opacity .6s var(--ease-out); }
  .avatar img.loaded { opacity: 1; }
  .avatar .initial {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #fff; font-size: 21px; font-weight: 600; letter-spacing: .01em;
  }
  .avatar img.loaded + .initial { opacity: 0; transition: opacity .4s var(--ease-out); }

  /* ---------- Большое фото на экране города ---------- */
  .cover {
    position: relative; height: 210px; overflow: hidden;
    background: var(--ph, linear-gradient(135deg, #f7801e, #ffb36b));
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block;
    opacity: 0; transform: scale(1.06); transition: opacity .8s var(--ease-out), transform 1.2s var(--ease-out); }
  .cover img.loaded { opacity: 1; transform: none; }
  .cover .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.62), rgba(0,0,0,.05) 55%); }
  .cover .caption { position: absolute; left: 16px; right: 16px; bottom: 14px; color: #fff; }
  .cover .caption h2 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.03em; text-shadow: 0 1px 12px rgba(0,0,0,.35); }
  .cover .caption .tagline { font-size: 14px; font-weight: 500; color: #ffd8b0; margin-top: 2px; }

  /* ---------- Фильтры-«пилюли» ---------- */
  .chip-row {
    display: flex; gap: 8px; padding: 10px 14px; overflow-x: auto;
    background: var(--bg); border-bottom: .5px solid var(--separator);
    scrollbar-width: none;
  }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 7px 14px; border-radius: 999px; border: none;
    background: var(--bg-grouped); color: var(--muted);
    font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
    transition: background .3s var(--ease-out), color .3s var(--ease-out), transform .3s var(--ease-spring);
  }
  .chip:active { transform: scale(.93); }
  .chip.active { background: var(--accent); color: #fff; }

  /* ---------- Текстовые блоки ---------- */
  .prose { background: var(--row); padding: 14px 16px 16px; border-bottom: .5px solid var(--separator); }
  .prose p { margin: 0; font-size: 15px; line-height: 1.5; color: #3a3a3c; }
  .info-label { font-size: 15px; font-weight: 600; color: var(--accent); margin-bottom: 3px; }
  .row .badge {
    display: inline-block; font-size: 12px; font-weight: 600; color: var(--accent);
    background: var(--accent-soft); border-radius: 6px; padding: 1px 7px; margin-bottom: 4px;
  }

  /* ---------- Звезда «в избранное» ---------- */
  .fav-star {
    flex: none; width: 36px; height: 36px; display: grid; place-items: center;
    color: var(--accent); cursor: pointer; user-select: none;
    transition: transform .4s var(--ease-spring);
  }
  .fav-star:active { transform: scale(.85); }
  .fav-star.on svg { animation: starPop .5s var(--ease-spring); }
  @keyframes starPop { 0% { transform: scale(.6) rotate(-25deg); } 60% { transform: scale(1.25) rotate(6deg); } 100% { transform: scale(1); } }

  .empty-state { text-align: center; color: var(--muted); font-size: 15px; padding: 90px 30px; }
  .empty-state .big {
    display: grid; place-items: center; width: 78px; height: 78px; margin: 0 auto 16px;
    border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  }

  /* ---------- Нижняя панель вкладок ---------- */
  nav.tabbar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px; z-index: 30;
    background: var(--nav-bg);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-top: .5px solid var(--separator);
    display: flex; justify-content: space-around;
    padding: 6px 0 calc(4px + env(safe-area-inset-bottom));
  }
  nav.tabbar button {
    background: none; border: none; font-family: inherit;
    font-size: 10px; font-weight: 500; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    cursor: pointer; padding: 4px 10px;
    transition: color .25s var(--ease-out), transform .35s var(--ease-spring);
  }
  nav.tabbar button:active { transform: scale(.9); }
  nav.tabbar button svg { width: 26px; height: 26px; }
  nav.tabbar button.active { color: var(--accent); }
  nav.tabbar button.active svg { animation: tabPop .45s var(--ease-spring); }
  @keyframes tabPop { 0% { transform: scale(.82); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }

  /* ---------- Плавное появление текста ---------- */
  @keyframes riseIn {
    from { opacity: 0; transform: translate3d(0, 12px, 0); filter: blur(5px); }
    to   { opacity: 1; transform: none; filter: blur(0); }
  }
  @keyframes riseInSoft {
    from { opacity: 0; transform: translate3d(0, 7px, 0); }
    to   { opacity: 1; transform: none; }
  }
  .reveal { opacity: 0; animation: riseIn .7s var(--ease-out) forwards; animation-delay: var(--d, 0ms); will-change: opacity, transform, filter; }
  .reveal-soft { opacity: 0; animation: riseInSoft .5s var(--ease-out) forwards; animation-delay: var(--d, 0ms); }
  .word { display: inline-block; opacity: 0; animation: riseIn .75s var(--ease-out) forwards; animation-delay: var(--d, 0ms); }

  .screen { animation: screenIn .45s var(--ease-out) both; }
  @keyframes screenIn { from { opacity: 0; transform: translate3d(0, 8px, 0); } to { opacity: 1; transform: none; } }
  .screen.push { animation: pushIn .42s var(--ease-out) both; }
  @keyframes pushIn { from { opacity: 0; transform: translate3d(26px, 0, 0); } to { opacity: 1; transform: none; } }
  .screen.pop { animation: popIn .42s var(--ease-out) both; }
  @keyframes popIn { from { opacity: 0; transform: translate3d(-20px, 0, 0); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .reveal, .reveal-soft, .word { opacity: 1; }
    .avatar img, .cover img { opacity: 1; transform: none; }
  }
</style>
</head>

  chevron: '<svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1 1 6 6-6 6"/></svg>',
  back: '<svg viewBox="0 0 11 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 1.5 2 9l7.5 7.5"/></svg>',
  starOn: '<svg width="23" height="23" viewBox="0 0 24 24" fill="currentColor"><path d="m12 3.5 2.7 5.6 6.1.8-4.5 4.2 1.2 6.1L12 17.2 6.5 20.2l1.2-6.1L3.2 9.9l6.1-.8z"/></svg>',
  starOff: '<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="m12 3.9 2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 17.2l-5.3 2.9 1.1-5.9L3.5 10l5.9-.8z"/></svg>',
  bigStar: '<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="m12 3.9 2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 17.2l-5.3 2.9 1.1-5.9L3.5 10l5.9-.8z"/></svg>',
};

let state = { tab: 'home', cityId: null, cityFilter: 'all', favorites: new Set(), transition: '' };

/* ---- каскад появления: каждый следующий блок стартует чуть позже ---- */
let tick = 0;
const STEP = 50, BASE = 40;
function d(extra = 0) { return `style="--d:${BASE + (tick++) * STEP + extra}ms"`; }
function resetTick() { tick = 0; }
function words(text, start = 0, step = 70) {
  return text.split(' ').map((w, i) => `<span class="word" style="--d:${start + i * step}ms">${w}</span>`).join(' ');
}
const esc = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

/* картинка появляется мягко; пока грузится — цветной кружок с буквой */
function avatar(item) {
  const src = item.img ? item.img.thumb : '';
  return `<div class="avatar" style="--ph:${item.ph}">
    ${src ? `<img src="${esc(src)}" alt="" loading="lazy" onload="this.classList.add('loaded')" onerror="this.remove()">` : ''}
    <div class="initial">${item.name.trim()[0]}</div>
  </div>`;
}

function render() {
  resetTick();
  const app = document.getElementById('app');
  const cls = 'screen' + (state.transition ? ' ' + state.transition : '');
  app.innerHTML = renderHeader() + `<main class="${cls}">` + renderMain() + '</main>' + renderTabbar();
  state.transition = '';
  window.scrollTo(0, 0);
}

function renderHeader() {
  if (state.cityId) {
    const c = cities.find(x => x.id === state.cityId);
    return `<header class="nav"><div class="nav-row">
      <button class="back-btn" onclick="closeCity()">${icons.back}<span>Города</span></button>
      <div class="nav-title reveal-soft" style="--d:180ms">${c.name.split(' (')[0]}</div>
    </div></header>`;
  }
  const titles = { home: 'Кипр', beaches: 'Пляжи', info: 'Информация', favorites: 'Избранное' };
  const subs = {
    home: 'Города и курорты острова',
    beaches: 'Куда ехать за морем',
    info: 'Всё, что нужно знать до поездки',
    favorites: 'Сохранённые места',
  };
  return `<header class="nav">
    <div class="nav-row"><div class="nav-title">${words(titles[state.tab], 0, 70)}</div></div>
    <div class="nav-sub reveal-soft" style="--d:190ms">${subs[state.tab]}</div>
  </header>`;
}

function renderMain() {
  if (state.cityId) return renderCityDetail();
  if (state.tab === 'beaches') return renderBeaches();
  if (state.tab === 'info') return renderInfo();
  if (state.tab === 'favorites') return renderFavorites();
  return renderCities();
}

function renderCities() {
  const filters = [['all','Все'],['south','Республика Кипр'],['north','Северный Кипр']];
  const chips = filters.map(([k,l]) =>
    `<div class="chip ${state.cityFilter===k?'active':''} reveal-soft" ${d()} onclick="setFilter('${k}')">${l}</div>`).join('');
  const list = cities.filter(c => state.cityFilter==='all' || c.region===state.cityFilter);
  const rows = list.map(c => `
    <div class="row reveal" ${d()} onclick="openCity('${c.id}')">
      ${avatar(c)}
      <div class="body">
        <div class="title">${c.name}</div>
        <div class="sub">${c.tagline}</div>
      </div>
      <div class="chev">${icons.chevron}</div>
    </div>`).join('');
  return `<div class="chip-row">${chips}</div>
    <div class="group-title reveal-soft" ${d()}>${list.length} направлени${list.length === 1 ? 'е' : list.length < 5 ? 'я' : 'й'}</div>
    <div class="group">${rows}</div>`;
}

function renderCityDetail() {
  const c = cities.find(x => x.id === state.cityId);
  const attractions = c.attractions.map(a => {
    const fav = state.favorites.has(a.id);
    return `<div class="row plain reveal" ${d()}>
      <div class="body"><div class="title">${a.name}</div><div class="sub">${a.description}</div></div>
      <div class="fav-star ${fav ? 'on' : ''}" onclick="toggleFav(event,'${a.id}')">${fav ? icons.starOn : icons.starOff}</div>
    </div>`;
  }).join('');
  return `
    <div class="cover" style="--ph:${c.ph}">
      ${c.img ? `<img src="${esc(c.img.cover)}" alt="${esc(c.name)}" onload="this.classList.add('loaded')" onerror="this.remove()">` : ''}
      <div class="shade"></div>
      <div class="caption">
        <h2>${words(c.name.split(' (')[0], 40, 80)}</h2>
        <div class="tagline reveal-soft" style="--d:260ms">${c.tagline}</div>
      </div>
    </div>
    <div class="prose"><p class="reveal" ${d(140)}>${c.description}</p></div>
    <div class="group-title reveal-soft" ${d()}>Что посмотреть</div>
    <div class="group">${attractions}</div>
    <div class="group-footer reveal-soft" ${d()}>Отмечайте места звёздочкой — они попадут во вкладку «Избранное».</div>`;
}

function renderBeaches() {
  const rows = beaches.map(b => `
    <div class="row reveal" ${d()}>
      ${avatar(b)}
      <div class="body">
        <span class="badge">${b.location}</span>
        <div class="title">${b.name}</div>
        <div class="sub">${b.note}</div>
      </div>
    </div>`).join('');
  return `<div class="group-title reveal-soft" style="--d:40ms">Лучшие пляжи</div><div class="group">${rows}</div>`;
}

function renderInfo() {
  const info = practicalInfo.map(r => `
    <div class="row plain reveal" ${d()}>
      <div class="body"><div class="info-label">${r.label}</div><div class="sub" style="-webkit-line-clamp:6">${r.value}</div></div>
    </div>`).join('');
  const food = cuisine.map(c => `
    <div class="row plain reveal" ${d()}>
      <div class="body"><div class="info-label">${c.name}</div><div class="sub" style="-webkit-line-clamp:4">${c.description}</div></div>
    </div>`).join('');
  return `<div class="group-title reveal-soft" style="--d:40ms">Практическая информация</div><div class="group">${info}</div>
    <div class="group-title reveal-soft" ${d()}>Кухня</div><div class="group">${food}</div>`;
}

function renderFavorites() {
  const all = cities.flatMap(c => c.attractions.map(a => ({...a, cityName: c.name})));
  const favs = all.filter(a => state.favorites.has(a.id));
  if (!favs.length) {
    return `<div class="empty-state reveal" style="--d:80ms">
      <div class="big">${icons.bigStar}</div>
      Пока пусто.<br>Отметьте места звёздочкой на странице города.</div>`;
  }
  const rows = favs.map(a => `
    <div class="row plain reveal" ${d()}>
      <div class="body"><span class="badge">${a.cityName}</span><div class="title">${a.name}</div><div class="sub">${a.description}</div></div>
      <div class="fav-star on" onclick="toggleFav(event,'${a.id}')">${icons.starOn}</div>
    </div>`).join('');
  return `<div class="group-title reveal-soft" style="--d:40ms">${favs.length} мест${favs.length === 1 ? 'о' : favs.length < 5 ? 'а' : ''}</div>
    <div class="group">${rows}</div>`;
}

function renderTabbar() {
  const tabs = [['home','Главная'],['beaches','Пляжи'],['info','Инфо'],['favorites','Избранное']];
  const buttons = tabs.map(([key,label]) =>
    `<button class="${state.tab===key && !state.cityId ?'active':''}" onclick="setTab('${key}')">
      ${icons[key]}<span>${label}</span>
    </button>`).join('');
  return `<nav class="tabbar">${buttons}</nav>`;
}

function setTab(tab) { if (tab === state.tab && !state.cityId) return; state.tab = tab; state.cityId = null; render(); }
function setFilter(f) { if (f === state.cityFilter) return; state.cityFilter = f; render(); }
function openCity(id) { state.cityId = id; state.transition = 'push'; render(); }
function closeCity() { state.cityId = null; state.transition = 'pop'; render(); }
function toggleFav(e, id) {
  e.stopPropagation();
  const on = !state.favorites.has(id);
  on ? state.favorites.add(id) : state.favorites.delete(id);
  if (state.tab === 'favorites' && !state.cityId) { render(); return; }
  const el = e.currentTarget;
  el.classList.toggle('on', on);
  el.innerHTML = on ? icons.starOn : icons.starOff;
}

render();
</script>
</body>
</html>
