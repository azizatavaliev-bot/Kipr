<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Кипр — гид</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-grouped: #f2f2f7;
    --row: #ffffff;
    --row-active: #f0f0f4;
    --text: #0b0b0c;
    --text-2: #3c3c43;
    --muted: #6f6f76;
    --separator: #e2e2e7;
    --accent: #f7801e;
    --accent-dark: #d96b0b;
    --accent-soft: #fff3e6;
    --nav-bg: rgba(255,255,255,.88);
    --ease-out: cubic-bezier(.16,1,.3,1);
    --ease-spring: cubic-bezier(.34,1.4,.44,1);

    /* Типографика: одна шкала, множитель меняется в настройках */
    --scale: 1;
    --fs-caption: calc(13px * var(--scale));
    --fs-foot:    calc(15px * var(--scale));
    --fs-body:    calc(17px * var(--scale));
    --fs-title:   calc(18px * var(--scale));
    --fs-nav:     calc(18px * var(--scale));
    --fs-h1:      calc(30px * var(--scale));
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif;
    font-size: var(--fs-body);
    line-height: 1.5;
    letter-spacing: -0.011em;
    background: var(--bg-grouped);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overscroll-behavior-y: none;
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100%; background: var(--bg-grouped); }

  /* ---------- Навигация ---------- */
  header.nav {
    position: sticky; top: 0; z-index: 20;
    background: var(--nav-bg);
    -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px);
    border-bottom: .5px solid var(--separator);
    padding: calc(env(safe-area-inset-top) + 9px) 12px 9px;
  }
  .nav-row { position: relative; display: flex; align-items: center; min-height: 34px; }
  .nav-title {
    position: absolute; left: 0; right: 0; text-align: center;
    font-size: var(--fs-nav); font-weight: 650; letter-spacing: -0.025em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding: 0 70px; pointer-events: none;
  }
  .nav-sub { text-align: center; font-size: var(--fs-caption); color: var(--muted); margin-top: 2px; }
  .nav-action {
    margin-left: auto; position: relative; z-index: 1;
    background: none; border: none; padding: 4px 2px; cursor: pointer;
    color: var(--accent); display: inline-flex; align-items: center;
    transition: opacity .2s var(--ease-out), transform .3s var(--ease-spring);
  }
  .nav-action:active { opacity: .5; transform: scale(.92); }
  .back-btn {
    position: relative; z-index: 1;
    background: none; border: none; padding: 4px 8px 4px 0; margin-left: -4px;
    font: inherit; font-size: var(--fs-body); color: var(--accent); cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
    transition: opacity .2s var(--ease-out), transform .25s var(--ease-spring);
  }
  .back-btn:active { opacity: .5; transform: translateX(-2px); }
  .back-btn svg { width: 11px; height: 18px; }

  main { padding: 0 0 calc(108px + env(safe-area-inset-bottom)); }

  /* ---------- Группы и строки ---------- */
  .group {
    background: var(--row); margin: 0 0 24px;
    border-top: .5px solid var(--separator); border-bottom: .5px solid var(--separator);
    overflow: hidden;
  }
  @media (min-width: 460px) { .group { margin: 0 12px 24px; border-radius: 14px; border: .5px solid var(--separator); } }
  .group-title {
    font-size: var(--fs-caption); font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .05em; padding: 24px 16px 8px;
  }
  .group-footer { font-size: var(--fs-caption); color: var(--muted); padding: 8px 16px 0; margin-top: -20px; margin-bottom: 24px; line-height: 1.5; }

  .row {
    position: relative; display: flex; align-items: center; gap: 13px;
    padding: 12px 14px; background: var(--row); cursor: pointer;
    transition: background .18s var(--ease-out);
  }
  .row:active { background: var(--row-active); }
  .row + .row::before { content: ''; position: absolute; top: 0; left: 81px; right: 0; height: .5px; background: var(--separator); }
  .row.plain + .row.plain::before { left: 16px; }
  .row .body { flex: 1; min-width: 0; }
  .row .title { font-size: var(--fs-title); font-weight: 620; letter-spacing: -0.02em; margin-bottom: 2px; line-height: 1.3; }
  .row .sub { font-size: var(--fs-foot); color: var(--muted); line-height: 1.45; }
  .row .sub.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .row .chev { flex: none; color: #c3c3c8; display: flex; }
  .row .geo {
    flex: none; width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center; color: var(--accent); background: var(--accent-soft);
    cursor: pointer; transition: transform .35s var(--ease-spring);
  }
  .row .geo:active { transform: scale(.86); }

  .avatar {
    flex: none; width: 55px; height: 55px; border-radius: 50%; overflow: hidden;
    background: var(--ph, linear-gradient(135deg, #f7801e, #ffb36b)); position: relative;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .6s var(--ease-out); }
  .avatar img.loaded { opacity: 1; }
  .avatar .initial { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 21px; font-weight: 600; }
  .avatar img.loaded + .initial { opacity: 0; transition: opacity .4s var(--ease-out); }

  /* ---------- Продающий блок ---------- */
  .pitch {
    background: linear-gradient(150deg, #ff9a3c, var(--accent) 55%, #e9650a);
    color: #fff; padding: 22px 20px 20px; position: relative; overflow: hidden;
  }
  @media (min-width: 460px) { .pitch { margin: 12px 12px 0; border-radius: 18px; } }
  .pitch h2 { margin: 0 0 6px; font-size: var(--fs-h1); font-weight: 700; letter-spacing: -0.03em; line-height: 1.12; text-wrap: balance; }
  .pitch p { margin: 0; font-size: var(--fs-foot); line-height: 1.5; color: rgba(255,255,255,.95); max-width: 34ch; }
  .pitch .facts { display: flex; gap: 18px; margin-top: 16px; }
  .pitch .facts div { line-height: 1.2; }
  .pitch .facts b { display: block; font-size: calc(21px * var(--scale)); font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .pitch .facts span { font-size: var(--fs-caption); opacity: .9; }
  .pitch .cta { margin-top: 18px; display: flex; gap: 10px; }
  .pitch .cta .btn { background: #fff; color: var(--accent-dark); flex: 1; }
  .pitch .cta .btn.ghost { background: rgba(255,255,255,.2); color: #fff; flex: none; padding: 13px 16px; }

  /* ---------- Часы ---------- */
  .clock {
    background: var(--row); border-top: .5px solid var(--separator); border-bottom: .5px solid var(--separator);
    padding: 14px 16px; display: flex; align-items: center; gap: 16px;
  }
  @media (min-width: 460px) { .clock { margin: 12px 12px 0; border-radius: 14px; border: .5px solid var(--separator); } }
  .clock .time {
    font-size: calc(38px * var(--scale)); font-weight: 680; letter-spacing: -0.035em; line-height: 1;
    font-variant-numeric: tabular-nums; color: var(--text);
  }
  .clock .time .sec { font-size: calc(20px * var(--scale)); font-weight: 600; color: var(--accent); }
  .clock .meta { font-size: var(--fs-caption); line-height: 1.5; color: var(--muted); }
  .clock .meta b { color: var(--text-2); font-weight: 600; }
  .clock .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #34c759; margin-right: 6px; animation: pulse 2s var(--ease-out) infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .3; transform: scale(.75); } }

  /* ---------- Сегментированный контрол ---------- */
  .segmented { display: flex; background: #e9e9ee; border-radius: 10px; padding: 2px; margin: 14px; gap: 2px; }
  .segmented button {
    flex: 1; border: none; background: none; font: inherit; font-size: var(--fs-foot); font-weight: 600;
    color: var(--text); padding: 7px 6px; border-radius: 8px; cursor: pointer;
    transition: background .25s var(--ease-out), color .25s var(--ease-out), transform .3s var(--ease-spring);
  }
  .segmented button:active { transform: scale(.96); }
  .segmented button.on { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.14); }

  .chip-row { display: flex; gap: 8px; padding: 4px 14px 12px; overflow-x: auto; scrollbar-width: none; }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 8px 15px; border-radius: 999px; border: none;
    background: #e9e9ee; color: var(--text-2);
    font-size: var(--fs-foot); font-weight: 600; cursor: pointer; white-space: nowrap;
    transition: background .3s var(--ease-out), color .3s var(--ease-out), transform .3s var(--ease-spring);
  }
  .chip:active { transform: scale(.93); }
  .chip.active { background: var(--accent); color: #fff; }

  .cover { position: relative; height: 230px; overflow: hidden; background: var(--ph, linear-gradient(135deg, #f7801e, #ffb36b)); }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transform: scale(1.06); transition: opacity .8s var(--ease-out), transform 1.2s var(--ease-out); }
  .cover img.loaded { opacity: 1; transform: none; }
  .cover .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.66), rgba(0,0,0,.05) 58%); }
  .cover .caption { position: absolute; left: 16px; right: 16px; bottom: 15px; color: #fff; }
  .cover .caption h2 { margin: 0; font-size: calc(27px * var(--scale)); font-weight: 700; letter-spacing: -0.03em; text-shadow: 0 1px 12px rgba(0,0,0,.4); }
  .cover .caption .tagline { font-size: var(--fs-foot); font-weight: 500; color: #ffd8b0; margin-top: 3px; }

  .prose { background: var(--row); padding: 15px 16px 17px; border-bottom: .5px solid var(--separator); }
  .prose p { margin: 0; font-size: var(--fs-body); line-height: 1.55; color: var(--text-2); max-width: 62ch; }
  .prose p + p { margin-top: 10px; }
  .info-label { font-size: var(--fs-title); font-weight: 620; color: var(--text); margin-bottom: 3px; }
  .row .badge {
    display: inline-block; font-size: calc(12px * var(--scale)); font-weight: 700; color: var(--accent);
    background: var(--accent-soft); border-radius: 6px; padding: 2px 7px; margin-bottom: 5px; letter-spacing: .01em;
  }

  /* ---------- Карта в духе Apple Maps ---------- */
  .map-wrap { position: relative; height: calc(100vh - 168px); min-height: 380px; background: #dfe8ee; overflow: hidden; touch-action: none; }
  .map-layer { position: absolute; inset: 0; }
  .map-layer img { position: absolute; width: 256px; height: 256px; user-select: none; -webkit-user-drag: none; }
  .map-fallback {
    position: absolute; inset: 0; display: grid; place-items: end center; text-align: center;
    color: #7b8a96; font-size: var(--fs-caption); padding: 0 24px 54px; line-height: 1.5;
    background: radial-gradient(circle at 50% 40%, #e9f0f5, #d8e3ea);
  }
  .map-search {
    position: absolute; left: 10px; right: 10px; top: 10px; z-index: 8;
    background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.16);
    display: flex; align-items: center; gap: 8px; padding: 9px 12px;
  }
  .map-search input { flex: 1; border: none; outline: none; background: none; font: inherit; font-size: var(--fs-foot); color: var(--text); }
  .map-search svg { color: var(--muted); flex: none; }
  .map-results {
    position: absolute; left: 10px; right: 10px; top: 56px; z-index: 8; max-height: 46%; overflow-y: auto;
    background: rgba(255,255,255,.96); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.18);
    animation: sheetUp .3s var(--ease-out) both;
  }
  .map-results .res { display: flex; align-items: center; gap: 10px; padding: 10px 13px; cursor: pointer; }
  .map-results .res + .res { border-top: .5px solid var(--separator); }
  .map-results .res:active { background: var(--row-active); }
  .map-results .res .t { font-size: var(--fs-foot); font-weight: 600; }
  .map-results .res .s { font-size: var(--fs-caption); color: var(--muted); }
  .res-dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; font-size: 13px; }

  .map-ctrl { position: absolute; right: 10px; top: 64px; z-index: 6; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
  .ctrl-stack {
    background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-radius: 11px; box-shadow: 0 3px 14px rgba(0,0,0,.2); overflow: hidden; display: flex; flex-direction: column;
  }
  .ctrl-stack button, .map-btn {
    width: 42px; height: 42px; border: none; background: none; cursor: pointer;
    color: var(--text); font-size: 20px; font-weight: 500; display: grid; place-items: center;
    transition: background .2s var(--ease-out), transform .3s var(--ease-spring);
  }
  .ctrl-stack button + button { border-top: .5px solid var(--separator); }
  .ctrl-stack button:active, .map-btn:active { background: var(--row-active); transform: scale(.94); }
  .map-btn {
    background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-radius: 11px; box-shadow: 0 3px 14px rgba(0,0,0,.2); color: var(--accent);
  }
  .map-styles {
    position: absolute; left: 10px; bottom: 12px; z-index: 6; display: flex; gap: 2px; padding: 3px;
    background: rgba(255,255,255,.9); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-radius: 11px; box-shadow: 0 3px 14px rgba(0,0,0,.2);
  }
  .map-styles button {
    border: none; background: none; font: inherit; font-size: calc(13px * var(--scale)); font-weight: 600;
    color: var(--text-2); padding: 7px 12px; border-radius: 9px; cursor: pointer;
    transition: background .25s var(--ease-out), color .25s var(--ease-out);
  }
  .map-styles button.on { background: var(--accent); color: #fff; }
  .map-attr { position: absolute; right: 10px; bottom: 6px; z-index: 5; font-size: 10px; color: rgba(0,0,0,.45); }
  .map-wrap.dark .map-attr { color: rgba(255,255,255,.7); }

  .marker { position: absolute; transform: translate(-50%, -50%); cursor: pointer; will-change: transform; }
  .marker .glyph {
    width: 30px; height: 30px; border-radius: 50%; background: var(--c, var(--accent));
    border: 2.5px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.3);
    display: grid; place-items: center; color: #fff; font-size: 14px;
    transition: transform .4s var(--ease-spring);
  }
  .marker.small .glyph { width: 22px; height: 22px; font-size: 11px; border-width: 2px; }
  .marker.sel .glyph { transform: scale(1.32); }
  .marker:active .glyph { transform: scale(1.2); }
  .marker .lbl {
    position: absolute; left: 50%; top: 100%; transform: translateX(-50%);
    margin-top: 3px; font-size: calc(11px * var(--scale)); font-weight: 650; color: #1c1c1e;
    white-space: nowrap; text-shadow: 0 0 3px #fff, 0 0 6px #fff, 0 1px 2px #fff;
  }
  .map-wrap.dark .marker .lbl { color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.95), 0 0 10px rgba(0,0,0,.7); }

  .callout {
    position: absolute; left: 10px; right: 10px; bottom: 60px; z-index: 9;
    background: rgba(255,255,255,.97); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
    border-radius: 16px; padding: 14px 16px; box-shadow: 0 10px 34px rgba(0,0,0,.28);
    animation: sheetUp .42s var(--ease-out) both;
  }
  @keyframes sheetUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  .callout .h { display: flex; align-items: flex-start; gap: 10px; }
  .callout .h .t { flex: 1; }
  .callout .t .n { font-size: var(--fs-title); font-weight: 650; letter-spacing: -0.02em; }
  .callout .t .s { font-size: var(--fs-caption); color: var(--muted); margin-top: 1px; }
  .callout .coords { font-size: var(--fs-caption); color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 6px; }
  .callout .close { background: #e9e9ee; border: none; width: 28px; height: 28px; border-radius: 50%; font-size: 16px; color: var(--muted); cursor: pointer; line-height: 1; }
  .callout .acts { display: flex; gap: 8px; margin-top: 12px; }

  /* ---------- Кнопки ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 16px; border-radius: 13px; border: none; cursor: pointer;
    font: inherit; font-size: var(--fs-body); font-weight: 650; text-decoration: none;
    background: var(--accent); color: #fff; letter-spacing: -0.01em;
    transition: transform .3s var(--ease-spring), background .25s var(--ease-out), opacity .25s;
  }
  .btn:active { transform: scale(.97); background: var(--accent-dark); }
  .btn.secondary { background: #e9e9ee; color: var(--text); }
  .btn.secondary:active { background: #dedee3; }
  .btn.wa { background: #25d366; }
  .btn.wa:active { background: #1fb457; }
  .btn.small { padding: 10px 13px; font-size: var(--fs-foot); border-radius: 11px; }
  .btn:disabled { opacity: .4; pointer-events: none; }
  .btn svg { width: 20px; height: 20px; flex: none; }

  /* ---------- Форма ---------- */
  .field { background: var(--row); padding: 11px 16px; position: relative; }
  .field + .field::before { content: ''; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--separator); }
  .field label { display: block; font-size: calc(12px * var(--scale)); font-weight: 700; color: var(--muted); margin-bottom: 3px; letter-spacing: .04em; text-transform: uppercase; }
  .field input, .field textarea, .field select {
    width: 100%; border: none; outline: none; background: none; font: inherit; font-size: var(--fs-body);
    color: var(--text); padding: 3px 0; resize: none;
  }
  .field input::placeholder, .field textarea::placeholder { color: #b9b9be; }
  .form-actions { padding: 4px 14px 0; display: flex; flex-direction: column; gap: 10px; }
  .preview {
    background: var(--accent-soft); border-radius: 13px; padding: 13px 15px; margin: 0 14px 8px;
    font-size: var(--fs-foot); line-height: 1.55; color: #7a4310; white-space: pre-wrap;
  }
  .hint { font-size: var(--fs-caption); color: var(--muted); padding: 0 16px; line-height: 1.5; max-width: 60ch; }
  .status { margin: 10px 14px 0; padding: 11px 14px; border-radius: 12px; font-size: var(--fs-foot); font-weight: 600; }
  .status.ok { background: #e6f8ec; color: #1b7a3d; }
  .status.err { background: #ffeceb; color: #b3261e; }
  .status.wait { background: #eef1f5; color: var(--muted); }

  .toast {
    position: fixed; left: 50%; bottom: calc(124px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: rgba(0,0,0,.88); color: #fff; font-size: var(--fs-foot); font-weight: 500;
    padding: 11px 17px; border-radius: 999px; z-index: 60; max-width: 88%; text-align: center;
    animation: toastIn .35s var(--ease-spring) both;
  }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }

  .fav-star { flex: none; width: 38px; height: 38px; display: grid; place-items: center; color: var(--accent); cursor: pointer; user-select: none; transition: transform .4s var(--ease-spring); }
  .fav-star:active { transform: scale(.85); }
  .fav-star.on svg { animation: starPop .5s var(--ease-spring); }
  @keyframes starPop { 0% { transform: scale(.6) rotate(-25deg); } 60% { transform: scale(1.25) rotate(6deg); } 100% { transform: scale(1); } }

  .empty-state { text-align: center; color: var(--muted); font-size: var(--fs-foot); padding: 90px 30px; line-height: 1.5; }
  .empty-state .big { display: grid; place-items: center; width: 80px; height: 80px; margin: 0 auto 16px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); }

  /* ---------- Игра ---------- */
  .game-wrap { position: relative; height: calc(100vh - 168px); min-height: 420px; overflow: hidden; touch-action: none;
    background: linear-gradient(#7fd3f0 0%, #cfeefb 46%, #bfe4f3 100%); }
  #game-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .g-hud { position: absolute; left: 10px; right: 10px; top: 10px; z-index: 4; display: flex; gap: 8px; align-items: center; pointer-events: none; }
  .g-pill {
    background: rgba(255,255,255,.82); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    border-radius: 999px; padding: 7px 13px; font-size: var(--fs-foot); font-weight: 700;
    box-shadow: 0 2px 10px rgba(0,0,0,.14); font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
  }
  .g-pill.lives { color: #ff3b30; letter-spacing: 1px; }
  .g-pill.combo { color: var(--accent); }
  .g-pill.spacer { margin-left: auto; background: none; box-shadow: none; padding: 0; }
  .g-overlay {
    position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 24px;
    background: rgba(255,255,255,.5); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);

let tick = 0;
const STEP = 50, BASE = 40;
function d(extra = 0) { return `style="--d:${BASE + (tick++) * STEP + extra}ms"`; }
function resetTick() { tick = 0; }
function words(text, start = 0, step = 70) {
  return text.split(' ').map((w, i) => `<span class="word" style="--d:${start + i * step}ms">${w}</span>`).join(' ');
}
const esc = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ==================== Часы Кипра ==================== */
let clockTimer = null;
function cyprusParts() {
  const now = new Date();
  const p = Object.fromEntries(new Intl.DateTimeFormat('ru-RU', {
    timeZone: CONFIG.timezone, hour: '2-digit', minute: '2-digit', second: '2-digit',
    weekday: 'long', day: 'numeric', month: 'long', hour12: false,
  }).formatToParts(now).map(x => [x.type, x.value]));
  const cy = new Date(now.toLocaleString('en-US', { timeZone: CONFIG.timezone }));
  const loc = new Date(now.toLocaleString('en-US'));
  const utcNow = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));
  return {
    h: p.hour, m: p.minute, s: p.second,
    date: `${p.weekday}, ${p.day} ${p.month}`,
    diffH: Math.round((cy - loc) / 3.6e6),
    utc: Math.round((cy - utcNow) / 3.6e6),
  };
}
function clockHTML() {
  const t = cyprusParts();
  const rel = t.diffH === 0 ? 'совпадает с вашим' : t.diffH > 0 ? `на ${t.diffH} ч впереди вас` : `на ${Math.abs(t.diffH)} ч позади вас`;
  return `<div class="clock reveal" style="--d:60ms">
    <div class="time" id="clock-time">${t.h}:${t.m}<span class="sec">:${t.s}</span></div>
    <div class="meta">
      <div><span class="dot"></span>Сейчас на Кипре</div>
      <div id="clock-date">${t.date}</div>
      <div><b>UTC${t.utc >= 0 ? '+' : ''}${t.utc}</b> · ${rel}</div>
    </div>
  </div>`;
}
function startClock() {
  stopClock();
  clockTimer = setInterval(() => {
    const el = document.getElementById('clock-time');
    if (!el) return stopClock();
    const t = cyprusParts();
    el.innerHTML = `${t.h}:${t.m}<span class="sec">:${t.s}</span>`;
    const dt = document.getElementById('clock-date');
    if (dt) dt.textContent = t.date;
  }, 1000);
}
function stopClock() { if (clockTimer) { clearInterval(clockTimer); clockTimer = null; } }

/* ==================== Карта ==================== */
const R2 = (window.devicePixelRatio || 1) > 1.3;
const TILES = {
  map: { url: (z,x,y) => `https://basemaps.cartocdn.com/rastertiles/voyager/${z}/${x}/${y}${R2 ? '@2x' : ''}.png`,
         attr: '© OpenStreetMap, © CARTO', max: 19, dark: false },
  sat: { url: (z,x,y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`,
         attr: 'Esri World Imagery', max: 18, dark: true },
  hyb: { url: (z,x,y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`,
         overlay: (z,x,y) => `https://basemaps.cartocdn.com/rastertiles/voyager_only_labels/${z}/${x}/${y}${R2 ? '@2x' : ''}.png`,
         attr: 'Esri · CARTO labels', max: 18, dark: true },
};
const KIND = {
  city:  { c: '#f7801e', glyph: '🏙' },
  spot:  { c: '#ff453a', glyph: '★' },
  beach: { c: '#0a9bd8', glyph: '🏖' },
};

const MapView = {
  lat: 35.00, lon: 33.20, z: 8, style: 'map',
  el: null, layer: null, pins: null, tiles: new Map(), loaded: 0,
  selected: null, query: '', anim: null, vx: 0, vy: 0, inertia: null,

  points() {
    const p = [];
    cities.forEach(c => {
      p.push({ kind: 'city', id: c.id, name: c.short, lat: c.lat, lon: c.lon, sub: c.tagline, cityId: c.id });
      c.attractions.forEach(a => p.push({ kind: 'spot', id: a.id, name: a.name, lat: a.lat, lon: a.lon, sub: `${c.short} · ${a.description}`, cityId: c.id }));
    });
    beaches.forEach(b => p.push({ kind: 'beach', id: b.id, name: b.name, lat: b.lat, lon: b.lon, sub: `Пляж · ${b.location}` }));
    return p;
  },
  project(lat, lon, z) {
    const s = 256 * Math.pow(2, z);
    const sin = Math.sin(Math.max(-85, Math.min(85, lat)) * Math.PI / 180);
    return { x: (lon + 180) / 360 * s, y: (0.5 - Math.log((1 + sin) / (1 - sin)) / (4 * Math.PI)) * s };
  },
  unproject(x, y, z) {
    const s = 256 * Math.pow(2, z);
    const n = Math.PI - 2 * Math.PI * y / s;
    return { lat: 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n))), lon: x / s * 360 - 180 };
  },

  mount() {
    this.el = document.getElementById('map');
    if (!this.el) return;
    this.layer = this.el.querySelector('.map-layer');
    this.pins = this.el.querySelector('.map-pins');
    this.tiles = new Map(); this.loaded = 0;
    this.el.classList.toggle('dark', !!TILES[this.style].dark);
    this.bind();
    this.draw();
  },

  bind() {
    const el = this.el;
    let dragging = false, lx = 0, ly = 0, lt = 0;
    el.addEventListener('pointerdown', e => {
      if (e.target.closest('.marker, button, .callout, .map-search, .map-results')) return;
      dragging = true; lx = e.clientX; ly = e.clientY; lt = performance.now();
      this.vx = this.vy = 0;
      cancelAnimationFrame(this.inertia); cancelAnimationFrame(this.anim);
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - lx, dy = e.clientY - ly, dt = Math.max(1, performance.now() - lt);
      lx = e.clientX; ly = e.clientY; lt = performance.now();
      this.vx = dx / dt * 16; this.vy = dy / dt * 16;
      this.panBy(-dx, -dy);
    });
    const stop = e => {
      if (!dragging) return;
      dragging = false;
      try { el.releasePointerCapture(e.pointerId); } catch (_) {}
      this.glide();
    };
    el.addEventListener('pointerup', stop);
    el.addEventListener('pointercancel', stop);
    el.addEventListener('wheel', e => {
      e.preventDefault();
      const r = el.getBoundingClientRect();
      this.zoomAt(e.deltaY < 0 ? 1 : -1, e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });
    el.addEventListener('dblclick', e => {
      const r = el.getBoundingClientRect();
      this.zoomAt(1, e.clientX - r.left, e.clientY - r.top);
    });
    let pinch = 0, z0 = 0;
    el.addEventListener('touchstart', e => { if (e.touches.length === 2) { pinch = this.dist(e.touches); z0 = this.z; } }, { passive: true });
    el.addEventListener('touchmove', e => {
      if (e.touches.length === 2 && pinch) {
        const z = Math.round(Math.max(2, Math.min(TILES[this.style].max, z0 + Math.log2(this.dist(e.touches) / pinch))));
        if (z !== this.z) { this.z = z; this.draw(); }
      }
    }, { passive: true });
    el.addEventListener('touchend', () => { pinch = 0; }, { passive: true });
  },
  dist(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); },

  panBy(dx, dy) {
    const c = this.project(this.lat, this.lon, this.z);
    const p = this.unproject(c.x + dx, c.y + dy, this.z);
    this.lat = Math.max(-85, Math.min(85, p.lat));
    this.lon = ((p.lon + 540) % 360) - 180;
    this.draw();
  },
  glide() {
    const step = () => {
      this.vx *= 0.94; this.vy *= 0.94;
      if (Math.abs(this.vx) < 0.4 && Math.abs(this.vy) < 0.4) return;
      this.panBy(-this.vx, -this.vy);
      this.inertia = requestAnimationFrame(step);
    };
    this.inertia = requestAnimationFrame(step);
  },
  zoomAt(dz, cx, cy) {
    const nz = Math.max(2, Math.min(TILES[this.style].max, this.z + dz));
    if (nz === this.z) return;
    const W = this.el.clientWidth, H = this.el.clientHeight;
    const c = this.project(this.lat, this.lon, this.z);
    const geo = this.unproject(c.x - W / 2 + cx, c.y - H / 2 + cy, this.z);
    this.z = nz;
    const g2 = this.project(geo.lat, geo.lon, nz);
    const nc = this.unproject(g2.x + (W / 2 - cx), g2.y + (H / 2 - cy), nz);
    this.lat = nc.lat; this.lon = nc.lon;
    this.draw();
  },
  zoom(dz) { if (this.el) this.zoomAt(dz, this.el.clientWidth / 2, this.el.clientHeight / 2); },

  flyTo(lat, lon, z, animate = true) {
    if (!this.el || !animate) { this.lat = lat; this.lon = lon; if (z) this.z = z; this.draw(); return; }
    cancelAnimationFrame(this.anim); cancelAnimationFrame(this.inertia);
    const l0 = this.lat, o0 = this.lon, zA = this.z, zB = z || this.z, t0 = performance.now(), dur = 620;
    const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const step = () => {
      const k = Math.min(1, (performance.now() - t0) / dur), e = ease(k);
      this.lat = l0 + (lat - l0) * e;
      this.lon = o0 + (lon - o0) * e;
      this.z = Math.round(zA + (zB - zA) * e);
      this.draw();
      if (k < 1) this.anim = requestAnimationFrame(step);
    };
    this.anim = requestAnimationFrame(step);
  },
  setStyle(s) {
    this.style = s;
    this.z = Math.min(this.z, TILES[s].max);
    this.tiles.forEach(n => n.remove()); this.tiles.clear(); this.loaded = 0;
    this.el.classList.toggle('dark', !!TILES[s].dark);
    const attr = this.el.querySelector('.map-attr');
    if (attr) attr.textContent = TILES[s].attr;
    this.draw(); renderMapControls();
  },

  draw() {
    if (!this.el || !document.body.contains(this.el)) return;
    const W = this.el.clientWidth, H = this.el.clientHeight, z = this.z, S = 256;
    const c = this.project(this.lat, this.lon, z);
    const ox = c.x - W / 2, oy = c.y - H / 2;
    const world = Math.pow(2, z);
    const src = TILES[this.style];
    const keep = new Set();
    const put = (url, key, left, top, zi) => {
      let img = this.tiles.get(key);
      if (!img) {
        img = new Image();
        img.decoding = 'async'; img.alt = '';
        img.style.opacity = '0'; img.style.zIndex = zi;
        img.style.transition = 'opacity .3s var(--ease-out)';
        img.onload = () => { img.style.opacity = '1'; this.loaded++; this.updateFallback(); };
        img.onerror = () => { img.remove(); this.tiles.delete(key); };
        img.src = url;
        this.layer.appendChild(img);
        this.tiles.set(key, img);
      }
      img.style.left = left + 'px'; img.style.top = top + 'px';
      keep.add(key);
    };

    for (let x = Math.floor(ox / S); x <= Math.floor((ox + W) / S); x++) {
      for (let y = Math.max(0, Math.floor(oy / S)); y <= Math.min(world - 1, Math.floor((oy + H) / S)); y++) {
        const wx = ((x % world) + world) % world;
        const left = x * S - ox, top = y * S - oy;
        put(src.url(z, wx, y), `${this.style}/${z}/${wx}/${y}/${x}`, left, top, 1);
        if (src.overlay) put(src.overlay(z, wx, y), `${this.style}L/${z}/${wx}/${y}/${x}`, left, top, 2);
      }
    }
    this.tiles.forEach((img, key) => { if (!keep.has(key)) { img.remove(); this.tiles.delete(key); } });
    this.drawPins(ox, oy, z);
  },
  updateFallback() {
    const fb = this.el && this.el.querySelector('.map-fallback');
    if (fb) fb.style.display = this.loaded > 0 ? 'none' : '';
  },
  drawPins(ox, oy, z) {
    const W = this.el.clientWidth, H = this.el.clientHeight;
    const pts = this.points().filter(p => z >= 11 || p.kind !== 'spot');
    const shown = [];   // чтобы подписи не наезжали друг на друга
    this.pins.innerHTML = pts.map(p => {
      const q = this.project(p.lat, p.lon, z);
      const x = q.x - ox, y = q.y - oy;
      if (x < -70 || y < -70 || x > W + 70 || y > H + 70) return '';
      const k = KIND[p.kind];
      const sel = this.selected && this.selected.id === p.id ? ' sel' : '';
      const small = p.kind === 'spot' ? ' small' : '';
      const crowded = shown.some(s => Math.abs(s.x - x) < 70 && Math.abs(s.y - y) < 26);
      const showLbl = z >= 7 && (!crowded || sel);
      if (showLbl) shown.push({ x, y });
      const lbl = showLbl ? `<span class="lbl">${esc(p.name)}</span>` : '';
      return `<div class="marker ${p.kind}${small}${sel}" style="left:${x}px;top:${y}px;--c:${k.c}"
        onclick="selectPlace('${p.kind}','${p.id}')"><span class="glyph">${k.glyph}</span>${lbl}</div>`;
    }).join('');
  },
};

function selectPlace(kind, id) {
  const p = MapView.points().find(x => x.id === id && x.kind === kind);
  if (!p) return;
  MapView.selected = p;
  MapView.query = '';
  const inp = document.getElementById('map-q');
  if (inp) inp.value = '';
  renderResults();
  MapView.flyTo(p.lat, p.lon, Math.max(MapView.z, p.kind === 'spot' ? 14 : 12));
  renderCallout();
}

function renderMapControls() {

/* ==================== Игра «Пляжный день» ==================== */
const Game = {
  canvas: null, ctx: null, raf: null, w: 0, h: 0, dpr: 1,
  screen: 'start', score: 0, best: store.get('cy_best', 0), lives: 3, combo: 1, level: 1,
  items: [], parts: [], player: { x: .5, tx: .5, tilt: 0 }, last: 0, spawn: 0, shake: 0, t: 0, _key: null,

  GOOD: [
    { g: '🧀', p: 10 }, { g: '🍢', p: 10 }, { g: '🍇', p: 8 },
    { g: '🍋', p: 8 }, { g: '🍉', p: 8 }, { g: '🍹', p: 14 }, { g: '🐚', p: 12 },
  ],
  BAD: [{ g: '🪼' }, { g: '🔥' }],

  mount() {
    this.canvas = document.getElementById('game-canvas');
    if (!this.canvas) return;
    this.ctx = this.canvas.getContext('2d');
    this.screen = 'start'; this.items = []; this.parts = [];
    this.resize();
    this.bind();
    this.last = performance.now();
    this.loop(this.last);
  },
  resize() {
    if (!this.canvas) return;
    const r = this.canvas.getBoundingClientRect();
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    this.w = r.width; this.h = r.height;
    this.canvas.width = Math.round(r.width * this.dpr);
    this.canvas.height = Math.round(r.height * this.dpr);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
  },
  bind() {
    const move = e => {
      const r = this.canvas.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
      this.player.tx = Math.max(.06, Math.min(.94, x / r.width));
    };
    this.canvas.addEventListener('pointermove', move);
    this.canvas.addEventListener('pointerdown', move);
    this._key = e => {
      if (this.screen !== 'play') return;
      if (e.key === 'ArrowLeft') this.player.tx = Math.max(.06, this.player.tx - .07);
      if (e.key === 'ArrowRight') this.player.tx = Math.min(.94, this.player.tx + .07);
    };
    window.addEventListener('keydown', this._key);
  },
  unmount() {
    cancelAnimationFrame(this.raf); this.raf = null;
    if (this._key) { window.removeEventListener('keydown', this._key); this._key = null; }
    this.canvas = null;
  },

  start() {
    this.score = 0; this.lives = 3; this.combo = 1; this.level = 1;
    this.items = []; this.parts = []; this.spawn = 0; this.shake = 0;
    this.screen = 'play';
    renderGameUI();
  },
  over() {
    this.screen = 'over';
    if (this.score > this.best) { this.best = this.score; store.set('cy_best', this.best); }
    renderGameUI();
  },

  spawnItem() {
    const bad = Math.random() < Math.min(.34, .16 + this.level * 0.02);
    const src = bad ? this.BAD[(Math.random() * this.BAD.length) | 0] : this.GOOD[(Math.random() * this.GOOD.length) | 0];
    this.items.push({
      x: .08 + Math.random() * .84, y: -.06,
      v: (0.24 + Math.random() * 0.12) * (1 + this.level * 0.11),
      rot: (Math.random() - .5) * 1.2, spin: (Math.random() - .5) * 2,
      bad, g: src.g, p: src.p || 0,
    });
  },
  burst(x, y, color, n = 12) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 150;
      this.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, life: 1, color });
    }
  },

  update(dt) {
    this.t += dt;
    const p = this.player;
    p.x += (p.tx - p.x) * Math.min(1, dt * 14);
    p.tilt = (p.tx - p.x) * 5;

    if (this.screen === 'play') {
      this.level = 1 + Math.floor(this.score / 150);
      this.spawn -= dt;
      if (this.spawn <= 0) { this.spawnItem(); this.spawn = Math.max(0.34, 0.95 - this.level * 0.06); }

      const catchY = 0.845;
      for (const it of this.items) {
        it.y += it.v * dt; it.rot += it.spin * dt;
        if (it.dead) continue;
        if (it.y >= catchY && it.y <= catchY + 0.08 && Math.abs(it.x - p.x) < 0.085) {
          it.dead = true;
          if (it.bad) {
            this.lives--; this.combo = 1; this.shake = 1;
            this.burst(it.x * this.w, catchY * this.h, '#ff453a', 16);
            if (this.lives <= 0) this.over();
          } else {
            this.score += Math.round(it.p * this.combo);
            this.combo = Math.min(5, this.combo + 0.25);
            this.burst(it.x * this.w, catchY * this.h, '#ffb340', 12);
          }
          renderGameHUD();
        } else if (it.y > 1.1) {
          it.dead = true;
          if (!it.bad && this.combo > 1) { this.combo = 1; renderGameHUD(); }
        }
      }
      this.items = this.items.filter(i => !i.dead);
    }

    for (const q of this.parts) { q.vy += 620 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt * 1.7; }
    this.parts = this.parts.filter(q => q.life > 0);
    this.shake = Math.max(0, this.shake - dt * 3);
  },

  render() {
    const c = this.ctx, w = this.w, h = this.h;
    if (!c) return;
    c.clearRect(0, 0, w, h);
    c.save();
    if (this.shake > 0) c.translate((Math.random() - .5) * 9 * this.shake, (Math.random() - .5) * 9 * this.shake);

    const sun = c.createRadialGradient(w * .8, h * .12, 4, w * .8, h * .12, w * .34);
    sun.addColorStop(0, 'rgba(255,247,214,.95)'); sun.addColorStop(1, 'rgba(255,247,214,0)');
    c.fillStyle = sun; c.fillRect(0, 0, w, h * .6);

    const seaTop = h * .46;
    const seaColors = ['rgba(43,168,214,.95)', 'rgba(29,146,200,.75)', 'rgba(16,120,178,.6)'];
    for (let i = 0; i < 3; i++) {
      c.beginPath();
      c.moveTo(0, seaTop + i * 9);
      for (let x = 0; x <= w; x += 12) c.lineTo(x, seaTop + i * 9 + Math.sin(x / 58 + this.t * (1.1 + i * .35) + i) * (5 - i));
      c.lineTo(w, h); c.lineTo(0, h); c.closePath();
      c.fillStyle = seaColors[i]; c.fill();
    }
    c.beginPath();
    c.moveTo(0, h * .78);
    for (let x = 0; x <= w; x += 12) c.lineTo(x, h * .78 + Math.sin(x / 90 + this.t * .7) * 4);
    c.lineTo(w, h); c.lineTo(0, h); c.closePath();
    c.fillStyle = '#f3dfae'; c.fill();

    c.textAlign = 'center'; c.textBaseline = 'middle';
    const fs = Math.round(Math.min(40, w * .095));
    for (const it of this.items) {
      c.save();
      c.translate(it.x * w, it.y * h);
      c.rotate(it.rot);
      c.font = `${fs}px -apple-system, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
      if (it.bad) { c.shadowColor = 'rgba(255,69,58,.6)'; c.shadowBlur = 14; }
      c.fillText(it.g, 0, 0);
      c.restore();
    }

    const px = this.player.x * w, py = h * .87;
    c.save();
    c.translate(px, py);
    c.rotate(Math.max(-.22, Math.min(.22, this.player.tilt)));
    c.fillStyle = 'rgba(0,0,0,.16)';
    c.beginPath(); c.ellipse(0, 26, 40, 8, 0, 0, 7); c.fill();
    c.fillStyle = '#ff9f0a';
    c.beginPath(); c.moveTo(-46, -6); c.quadraticCurveTo(0, -46, 46, -6); c.closePath(); c.fill();
    c.fillStyle = '#ffffff';
    c.beginPath(); c.moveTo(-16, -21); c.quadraticCurveTo(0, -46, 16, -21); c.closePath(); c.fill();
    c.fillStyle = '#ffffff';
    c.beginPath(); c.roundRect(-42, -4, 84, 13, 7); c.fill();
    c.fillStyle = 'rgba(0,0,0,.08)';
    c.beginPath(); c.roundRect(-42, 5, 84, 4, 3); c.fill();
    c.restore();

    for (const q of this.parts) {
      c.globalAlpha = Math.max(0, q.life);
      c.fillStyle = q.color;
      c.beginPath(); c.arc(q.x, q.y, 3.4 * q.life + 1, 0, 7); c.fill();
    }
    c.globalAlpha = 1;
    c.restore();
  },

  loop(now) {
    if (!this.canvas || !document.body.contains(this.canvas)) return;
    const dt = Math.min(0.05, (now - this.last) / 1000);
    this.last = now;
    this.update(dt);
    this.render();
    this.raf = requestAnimationFrame(t => this.loop(t));
  },
};

/* ==================== Заявка ==================== */
function applyText() {
  const f = state.form;
  const lines = [
    'Здравствуйте! Я хочу полететь на Кипр 🇨🇾', '',
    `Имя: ${f.name || '—'}`,
    `Телефон: ${f.phone || '—'}`,
  ];
  if (f.city) lines.push(`Направление: ${f.city}`);
  if (f.when) lines.push(`Даты: ${f.when}`);
  if (f.people) lines.push(`Человек: ${f.people}`);
  if (f.comment) lines.push(`Комментарий: ${f.comment}`);
  lines.push('', 'Заявка из приложения «Кипр — гид».');
  return lines.join('\n');
}
const phoneOk = v => v.replace(/\D/g, '').length >= 9;
const formValid = () => state.form.name.trim().length >= 2 && phoneOk(state.form.phone);

function setField(key, value) {
  state.form[key] = value;
  store.set('cy_form', state.form);
  const prev = document.getElementById('apply-preview');
  if (prev) prev.textContent = applyText();
  const send = document.getElementById('apply-send');
  if (send) send.disabled = !formValid();
}

function openWhatsApp() {
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(applyText())}`, '_blank', 'noopener');
}
async function sendApply() {
  if (!formValid()) { toast('Заполните имя и телефон'); return; }
  saveLead();
  if (!CONFIG.leadEndpoint) {
    openWhatsApp();
    setStatus('wait', 'Открыли WhatsApp с готовым сообщением — осталось нажать «Отправить».');
    return;
  }
  setStatus('wait', 'Отправляем заявку менеджеру…');
  const btn = document.getElementById('apply-send');
  if (btn) btn.disabled = true;
  try {
    const res = await fetch(CONFIG.leadEndpoint, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...state.form, text: applyText(), source: 'cyprus-guide' }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    setStatus('ok', 'Заявка отправлена. Менеджер напишет вам в WhatsApp в ближайшее время.');
    toast('Заявка отправлена');
  } catch (e) {
    setStatus('err', 'Не удалось отправить автоматически. Открываем WhatsApp — сообщение уже готово.');
    openWhatsApp();
  } finally {
    if (btn) btn.disabled = !formValid();
  }
}
function setStatus(kind, text) {
  state.sending = { kind, text };
  const host = document.getElementById('apply-status');
  if (host) host.innerHTML = `<div class="status ${kind}">${esc(text)}</div>`;
}
function saveLead() {
  const leads = store.get('cy_leads', []);
  leads.push({ ...state.form, ts: new Date().toISOString() });
  store.set('cy_leads', leads);
}
function copyText(text, msg) {
  const done = () => toast(msg || 'Скопировано');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (_) { toast('Не удалось скопировать'); }
  ta.remove();
}
let toastTimer = null;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2800);
}

  }
  const rows = favs.map(a => `
    <div class="row plain reveal" ${d()}>
      <div class="body"><span class="badge">${a.cityName}</span><div class="title">${a.name}</div><div class="sub">${a.description}</div></div>
      <div class="geo" onclick="showOnMap(${a.lat},${a.lon},14)">${icons.pin}</div>
      <div class="fav-star on" onclick="toggleFav(event,'${a.id}')">${icons.starOn}</div>
    </div>`).join('');
  return `<div class="group-title reveal-soft" style="--d:40ms">${favs.length} мест${favs.length === 1 ? 'о' : favs.length < 5 ? 'а' : ''}</div>
    <div class="group">${rows}</div>`;
}

function renderTabbar() {
  const tabs = [['home','Главная'],['map','Карта'],['game','Игра'],['info','Инфо'],['apply','Заявка']];
  const buttons = tabs.map(([key,label]) =>
    `<button class="${state.tab===key && !state.cityId && !state.showFavorites ?'active':''}" onclick="setTab('${key}')">
      ${icons[key]}<span>${label}</span>
    </button>`).join('');
  return `<nav class="tabbar">${buttons}</nav>`;
}

/* ==================== Действия ==================== */
function setTab(tab) {
  if (tab === state.tab && !state.cityId && !state.showFavorites) return;
  state.tab = tab; state.cityId = null; state.showFavorites = false; render();
}
function setHomeMode(m) { if (m === state.homeMode) return; state.homeMode = m; render(); }
function setFilter(f) { if (f === state.cityFilter) return; state.cityFilter = f; render(); }
function setScale(v) {
  state.scale = v; store.set('cy_scale', v);
  document.documentElement.style.setProperty('--scale', v);
  render();
}
function openCity(id) { state.cityId = id; state.showFavorites = false; state.transition = 'push'; render(); }
function closeCity() { state.cityId = null; state.transition = 'pop'; render(); }
function openFavorites() { state.showFavorites = true; state.transition = 'push'; render(); }
function closeFavorites() { state.showFavorites = false; state.transition = 'pop'; render(); }
function applyFor(city) { state.form.city = city; store.set('cy_form', state.form); setTab('apply'); }
function showOnMap(lat, lon, z) {
  state.tab = 'map'; state.cityId = null; state.showFavorites = false; state.transition = 'push';
  MapView.lat = lat; MapView.lon = lon; MapView.z = z || 13; MapView.selected = null;
  render();
}
function toggleFav(e, id) {
  e.stopPropagation();
  const on = !state.favorites.has(id);
  on ? state.favorites.add(id) : state.favorites.delete(id);
  store.set('cy_favs', [...state.favorites]);
  if (state.showFavorites) { render(); return; }
  const el = e.currentTarget;
  el.classList.toggle('on', on);
  el.innerHTML = on ? icons.starOn : icons.starOff;
}

window.addEventListener('resize', () => {
  if (MapView.el && document.body.contains(MapView.el)) MapView.draw();
  if (Game.canvas && document.body.contains(Game.canvas)) Game.resize();
});

render();
</script>
</body>
</html>
