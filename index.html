<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кипр — тревел-лендинг</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="hero">
  <div class="hero__bg" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#">
      <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5l1.9 6.6 6.6 1.9-6.6 1.9-1.9 6.6-1.9-6.6L3.5 10l6.6-1.9z"/></svg>
      <span>КИПР</span>
    </a>

    <nav class="nav" aria-label="Основная навигация">
      <a class="nav__link nav__link--active" href="#">Главная</a>
      <a class="nav__link" href="#">Направления</a>
      <a class="nav__link" href="#">Туры</a>
      <a class="nav__link" href="#">Отзывы</a>
    </nav>

    <div class="actions">
      <a class="chip" href="#">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7V6a6 6 0 1112 0v1h2.2l1 14H2.8l1-14H6zm2 0h8V6a4 4 0 10-8 0v1z"/></svg>
        <span>Моя поездка</span>
        <b class="chip__count">3</b>
      </a>
      <a class="chip chip--icon" href="#" aria-label="Профиль">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-5 0-9 2.7-9 6v2h18v-2c0-3.3-4-6-9-6z"/></svg>
      </a>
    </div>
  </header>

  <h1 class="wordmark">Кипр</h1>

  <div class="scene" aria-hidden="true">
    <svg class="scene__art" viewBox="0 0 760 640" role="presentation">
      <defs>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#19a4bd"/><stop offset="100%" stop-color="#065f79"/>
        </linearGradient>
        <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fbe3c4"/><stop offset="100%" stop-color="#cf9668"/>
        </linearGradient>
        <linearGradient id="rock2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f2cda2"/><stop offset="100%" stop-color="#b87f55"/>
        </linearGradient>
        <clipPath id="lagoon"><circle cx="380" cy="400" r="218"/></clipPath>
      </defs>

      <ellipse cx="380" cy="612" rx="250" ry="26" fill="#8c3200" opacity=".22"/>
      <circle class="sun" cx="380" cy="196" r="132" fill="#ffc266"/>
      <circle cx="380" cy="400" r="218" fill="url(#sea)"/>

      <g clip-path="url(#lagoon)">
        <path d="M170 402c16-52 36-92 58-122 20-27 37-19 48 10 13 34 22 72 27 112z" fill="url(#rock2)"/>
        <path d="M262 404c18-84 43-146 73-188 28-39 52-27 69 17 20 53 33 117 40 171z" fill="url(#rock)"/>
        <path d="M430 404c11-49 27-86 46-114 15-22 28-15 37 9 10 30 17 68 22 105z" fill="url(#rock2)"/>
        <rect x="120" y="400" width="520" height="240" fill="url(#sea)" opacity="0"/>
        <g class="waves" fill="none" stroke="#c7f0f7" stroke-width="6" stroke-linecap="round" opacity=".5">
          <path d="M186 458c22-14 44-14 66 0s44 14 66 0"/>
          <path d="M404 496c22-14 44-14 66 0s44 14 66 0"/>
          <path d="M212 542c22-14 44-14 66 0s44 14 66 0"/>
          <path d="M400 586c22-14 44-14 66 0s44 14 66 0"/>
        </g>
        <g class="boat">
          <path d="M436 470h86l-15 26h-56z" fill="#ffffff"/>
          <path d="M478 400l32 62h-32z" fill="#f4f9fa"/>
          <path d="M474 400l-30 62h30z" fill="#ffd7a8"/>
        </g>
      </g>

      <g class="palm">
        <path d="M150 614c4-70 12-122 26-162" stroke="#7d4a2a" stroke-width="14" fill="none" stroke-linecap="round"/>
        <g fill="#1f7a5c">
          <path d="M178 448c-42-24-82-22-104 6 34-6 66-2 96 16z"/>
          <path d="M180 444c-14-44-42-70-78-72 26 22 44 48 56 82z"/>
          <path d="M184 444c22-40 56-58 92-50-32 10-56 30-72 62z"/>
          <path d="M184 452c40-8 74 4 92 34-30-18-60-24-90-14z"/>
        </g>
      </g>
    </svg>
  </div>

  <footer class="bottom">
    <ul class="facts">
      <li><b>320+</b><span>солнечных дней</span></li>
      <li><b>60+</b><span>пляжей и бухт</span></li>
      <li><b>24°</b><span>вода летом</span></li>
    </ul>

    <section class="card">
      <p class="card__text">
        Мы собираем маршруты вместе с местными гидами: бухты Айя-Напы, горы Троодос
        и закаты на Петра-ту-Ромиу — без спешки и туристических ловушек.
      </p>
      <a class="cta" href="#">
        <span>Смотреть туры</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.2 5l7 7-7 7-1.4-1.4 4.6-4.6H3v-2h13.4l-4.6-4.6z"/></svg>
      </a>
    </section>
  </footer>

</main>
</body>
</html>
